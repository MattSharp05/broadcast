name: e2e set-up
description: >-
  Installs dependencies, starts local Supabase (in the background while the browser installs),
  exports its URL and keys, and builds the app for Playwright.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    # Pulling the Supabase images is the slow part: start it now and install the browser meanwhile.
    - name: Start Supabase (background)
      shell: bash
      run: |
        (pnpm supabase start \
          -x realtime,imgproxy,studio,edge-runtime,logflare,vector,supavisor \
          > supabase-start.log 2>&1; echo $? > supabase-start.exit) &
    - name: Playwright version
      id: pw
      shell: bash
      run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
    # The runner's apt mirror sometimes stalls while fetching fonts: short apt timeouts with
    # retries, and the whole install retried up to 3 times, so one stall doesn't eat the job.
    - name: Install Chromium and its system libraries
      shell: bash
      run: |
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' \
          | sudo tee /etc/apt/apt.conf.d/80-ci-retries > /dev/null
        for attempt in 1 2 3; do
          if timeout 90 pnpm exec playwright install --with-deps --only-shell chromium; then exit 0; fi
          echo "Playwright install attempt $attempt failed or stalled; retrying" >&2
          # `timeout` only kills pnpm; a stalled apt-get keeps the dpkg lock. Stop it and repair.
          sudo pkill -9 -x apt-get || true
          sudo pkill -9 -x dpkg || true
          sleep 2
          sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock /var/lib/apt/lists/lock
          sudo dpkg --configure -a || true
        done
        exit 1
    - name: Wait for Supabase
      shell: bash
      run: |
        timeout 240 bash -c 'until [ -f supabase-start.exit ]; do sleep 2; done'
        tail -5 supabase-start.log
        exit "$(cat supabase-start.exit)"
    - name: Export Supabase URL and keys
      shell: bash
      run: pnpm -s db:env | sed 's/"//g' >> "$GITHUB_ENV"
    - uses: actions/cache@v4
      with:
        path: .next/cache
        key: nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
        restore-keys: nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-
    - shell: bash
      run: pnpm build
